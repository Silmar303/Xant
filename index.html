<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xant-Ω</title>

    <!-- Polices Eunomia & Xolonium -->
    <link href="https://fonts.cdnfonts.com/css/eunomia" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/xolonium" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0f;
            color: white;
            font-family: 'Xolonium', sans-serif;
            height: 100vh;
            overflow: hidden;
        }

        /* Layout 3 colonnes pleine hauteur */
        .layout {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            height: 100vh;
        }

        /* Colonnes latérales */
        .column {
            position: relative;
            height: 100%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .column.left {
            border-right: 4px solid #9F81BA;
        }

        .column.right {
            border-left: 4px solid #9F81BA;
        }

        .column img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        /* Colonne centrale avec illustration en fond */
        .center-box {
            position: relative;
            height: 100%;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;

            /* Illustration centrale en fond */
            background-image: url('Images/Illustration_centre.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Contenu au-dessus du fond */
        .center-box * {
            position: relative;
            z-index: 2;
        }

        /* Titre */
        .center-box h1 {
            font-family: 'Eunomia', sans-serif;
            font-size: 150px;
            margin: 0;
            text-align: center;
			text-shadow:
				-3px -3px 0 #000,
				3px -3px 0 #000,
				-3px  3px 0 #000,
				3px  3px 0 #000;
        }

        /* Boutons */

		.center-box .btn:nth-of-type(4) {
		    margin-top: 15px;   /* bouton "Remerciements" */
			}
		
        .btn {
            padding: 25px 25px;
            background: #25204C;
            border: 2px solid #9F81BA;
            color: white;
            text-decoration: none;
            font-size: 22px;
            border-radius: 10px;
            transition: 0.25s;
            width: 260px;
            text-align: center;
        }

        .btn:hover {
            background: #9F81BA;
            color: black;
        }

		.small-link {
		    margin-top: -25px;   /* rapproche le lien du bouton */
		    margin-bottom: -5px; /* rapproche le lien du bouton */
		    text-align: center;
		}

		.small-link a {
		    font-size: 14px;
		    color: #25204C;
		    text-decoration: none;
		}
	
		.small-link a:hover {
		    color: #9F81BA;
		    text-decoration: underline;
		}
		.footer {
    		margin-top: 70px;
    		display: flex;
    		gap: 25px;
    		justify-content: center;
    		align-items: center;
			position: relative; /* nécessaire pour la ligne */
		}

		.footer img {
    		width: 40px;
    		height: 40px;
    		filter: drop-shadow(0 0 6px #9F81BA);
    		transition: 0.25s;
		}

		.footer img:hover {
    		transform: scale(1.15);
    		filter: drop-shadow(0 0 10px #ffffff);
		}
		
        /* Responsive */
        @media (max-width: 900px) {
    	.layout {
        	grid-template-columns: 1fr;
    	}
    	.column.left,
    	.column.right {
        	display: none;
    	}
    	body {
        	overflow-y: auto;
    	}
    	.center-box h1 {
        	font-size: 80px;
    	}
    	.footer {
        	margin-top: 50px;
        	gap: 35px;
    	}
    	.footer img {
        	width: 45px;
        	height: 45px;
    	}
	}
		
    </style>
</head>

<body>

    <div class="layout">

        <!-- Colonne gauche -->
        <div class="column left">
            <img src="Images/Illustration_gauche.png" alt="Illustration gauche">
        </div>

        <!-- Colonne centrale -->
		<div class="center-box">

			<h1>Xant-Ω</h1>

			<a class="btn" href="https://drive.google.com/file/d/1pm_pLGBC_xiuAEYi3dBEH9B7bsjDfsZb/view?usp=sharing" target="_blank">
			Livret de règles
			</a>
			
			<div class="small-link">
      			<a href="https://drive.google.com/file/d/1ilBt6LYfUR6WrXWyt7UL70WqW7MeRSiv/view?usp=sharing" target="_blank">Version haute qualité</a>
   			</div>
			
			<a class="btn" href="https://drive.google.com/file/d/1h25gIbou7tsbd_Y684c7Q9bzmx6XfMr1/view?usp=sharing" target="_blank">
			Scénarios et variantes
			</a>
			
			<div class="small-link">
    			<a href="https://drive.google.com/file/d/1x0374FFBMjbLEzuOQiSXSrITtPsIV8Op/view?usp=sharing" target="_blank"> Version haute qualité</a>
			</div>
			
			<a class="btn" href="Aides_de_jeu.html">
			Aides de jeu
			</a>

			<a class="btn" href="Remerciements.html">
			Remerciements
			</a>
			
			<div class="footer">
    			<a href="https://discord.gg/XggvUmn2w" target="_blank">
        		<img src="Images/icon_discord.png" alt="Discord">
    			</a>

    			<a href="https://www.youtube.com/@silartofficial" target="_blank">
        		<img src="Images/icon_youtube.png" alt="YouTube">
			    </a>

    			<a href="https://www.instagram.com/silart303/" target="_blank">
        		<img src="Images/icon_instagram.png" alt="Instagram">
    			</a>			
			</div>
	</div>
        <!-- Colonne droite -->
        <div class="column right">
            <img src="Images/Illustration_droite.png" alt="Illustration droite">
        </div>

    </div>

</body>
</html>
